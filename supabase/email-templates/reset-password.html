<!--
  明理 · Supabase 邮件模板副本（Reset password / 重置密码）
  ── 本文件是【线上模板的仓库副本】，应用运行时不读它，仅供人工核对与回贴。
  ── 粘贴位置：Supabase Dashboard → Authentication → Emails → Templates → Reset password → Body
  ── Subject 需在 Subject 输入框单独填写（本文件不含 Subject）：重置密码
  ── 守护：scripts/test-email-templates.mjs（npm run verify 会跑）
  ──
  ── ★★ type 必须是 recovery，写成 signup 会让回调页跳【首页】而不是 /reset-password
  ──   （src/app/auth/callback/page.tsx：type === 'recovery' ? '/reset-password' : '/'），
  ──   用户会误以为「重置失败」。断言 test-email-templates 逐份核对 type 与模板的对应关系。
  ── ★ 裸链兜底【必须保留】：任何客户端把超链接改坏时，用户仍可复制粘贴自救。
  ── ★ 同时修掉了旧模板的错字：「请点由下方链接」→「请点击下方按钮」。
-->
<h2>重置密码</h2>
<p>我们收到您重置密码的请求。请点击下方按钮设置新密码：</p>
<p>
  <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery"
     style="display:inline-block;padding:12px 26px;background:#8b2f2f;color:#ffffff;text-decoration:none;border-radius:999px;font-weight:bold;">
    点此设置新密码
  </a>
</p>
<p style="font-size:13px;color:#666666;">
  若按钮无法点击，请复制下面这条完整链接，粘贴到浏览器地址栏打开：<br>
  {{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery
</p>
<p style="font-size:13px;color:#666666;">
  重置链接只能使用一次且有时效。如果您没有进行过此操作，可以忽略这封邮件。
</p>
